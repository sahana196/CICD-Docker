services:
  - type: web
    name: cicd-docker-app
    runtime: image
    image:
      url: docker.io/YOUR_DOCKERHUB_USERNAME/cicd-docker:latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_MESSAGE
        value: Hello from Render Cloud!
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xms256m -Xmx512m
    autoDeploy: true
